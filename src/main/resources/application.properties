spring.application.name=ai-revenue-recovery

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/revenue_recovery
spring.datasource.username=postgres
spring.datasource.password=password

# Google Gemini AI
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}

spring.ai.google.genai.chat.model=gemini-2.5-flash
spring.ai.google.genai.chat.temperature=0.3

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info