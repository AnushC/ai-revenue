spring.application.name=ai-revenue-recovery

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/revenue_recovery
spring.datasource.username=postgres
spring.datasource.password=password

# AI
spring.ai.google.genai.api-key=$"ur-api-key"
spring.ai.google.genai.chat.options.model=gemini-3.6-flash

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info
